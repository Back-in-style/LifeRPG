name: liferpg
description: 심기체연 인생 게임
publish_to: "none"
version: 3.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태관리 / 라우팅
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # 로컬 DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # 모델

  # UI / 기능
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  intl: any # flutter_localizations가 버전을 고정함
  timezone: ^0.9.4 # 알림 예약 (flutter_local_notifications)
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  fonts:
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic.ttf
