name: liferpg
description: 현실성 기반 자기계발 인생 RPG
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태관리 / 라우팅
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # 로컬 DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # 모델
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI / 기능
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  intl: any # flutter_localizations가 버전을 고정함

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  fonts:
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic.ttf
